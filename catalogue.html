<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogue - Site Commande</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Catalogue</h1>
    <form id="catalogueForm">
      <div id="articlesList"></div>
      <button type="submit">Voir le récapitulatif</button>
    </form>
  </div>

  <script>
    // Vérifie que l'utilisateur est connecté
    if (!sessionStorage.getItem("user")) {
      alert("Veuillez vous connecter d'abord.");
      window.location.href = "index.html";
    }

    // Liste des articles
    const articles = [
      { id: 1, name: "Boite à Outils", price: 182, img: "http://www.image-heberg.fr/files/17924026123168397774.png" },
      { id: 2, name: "Acier", price: 50, img: "http://www.image-heberg.fr/files/1792402728844258705.png" },
      { id: 3, name: "Acier Compacté", price: 100, img: "http://www.image-heberg.fr/files/17924027111121915187.png" },
      { id: 4, name: "Cuivre Usé", price: 35, img: "http://www.image-heberg.fr/files/17924026724103198677.png" },
      { id: 5, name: "Plaque d'aluminium", price: 35, img: "http://www.image-heberg.fr/files/17924026952891097335.png" },
      { id: 6, name: "Feraille", price: 15, img: "http://www.image-heberg.fr/files/17924026363395219449.png" },
      { id: 7, name: "Aluminium", price: 18, img: "http://www.image-heberg.fr/files/17924026532247200999.png" },
    ];

    const articlesList = document.getElementById("articlesList");

    // Affiche les articles dans le formulaire
    articles.forEach((art) => {
      const articleDiv = document.createElement("div");
      articleDiv.className = "article";

      articleDiv.innerHTML = `
        <img src="${art.img}" alt="${art.name}" />
        <div class="article-details">
          <strong>${art.name}</strong><br />
          Prix : ${art.price.toFixed(2)} $
        </div>
        <div class="article-qty">
          <label>Quantité :</label>
          <input type="number" min="0" value="0" name="qty-${art.id}" />
        </div>
      `;

      articlesList.appendChild(articleDiv);
    });

    // Envoi du formulaire
    const form = document.getElementById("catalogueForm");
    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const order = [];

      articles.forEach((art) => {
        const qty = parseInt(formData.get(`qty-${art.id}`)) || 0;
        if (qty > 0) {
          order.push({ ...art, quantity: qty });
        }
      });

      if (order.length === 0) {
        alert("Veuillez sélectionner au moins un article.");
        return;
      }

      sessionStorage.setItem("order", JSON.stringify(order));
      window.location.href = "recap.html";
    });
  </script>
</body>
</html>
