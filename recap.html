<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Récapitulatif de la commande</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Récapitulatif de la commande</h1>

    <div id="deliveryInfo"></div>
    <div id="orderSummary"></div>

    <div class="button-group">
      <button id="backBtn" onclick="history.back()">Modifier la commande</button>
      <button id="sendOrderBtn">Envoyer la commande</button>
    </div>
  </div>

  <script>
    const deliveryInfo = JSON.parse(sessionStorage.getItem("deliveryInfo"));
    const order = JSON.parse(sessionStorage.getItem("order"));
    const entreprise = sessionStorage.getItem("user");
    const orderSummary = document.getElementById("orderSummary");
    const deliveryInfoDiv = document.getElementById("deliveryInfo");
    const sendOrderBtn = document.getElementById("sendOrderBtn");

    if (!deliveryInfo || !order) {
      alert("Informations de commande manquantes. Veuillez vous reconnecter.");
      window.location.href = "index.html";
    }

    deliveryInfoDiv.innerHTML = `
      <p><strong>Contact :</strong> ${deliveryInfo.contactName}</p>
      <p><strong>Téléphone :</strong> ${deliveryInfo.contactPhone}</p>
      <p><strong>Date de livraison :</strong> ${deliveryInfo.deliveryDate}</p>
      <p><strong>Heure de livraison :</strong> ${deliveryInfo.deliveryTime}</p>
    `;

    let html = `
      <table>
        <thead>
          <tr>
            <th>Article</th>
            <th>Prix unitaire</th>
            <th>Quantité</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
    `;

    let totalPrice = 0;

    order.forEach(item => {
      const lineTotal = item.price * item.quantity;
      totalPrice += lineTotal;
      html += `
        <tr>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td>$${lineTotal.toFixed(2)}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3"><strong>Total général</strong></td>
            <td><strong>$${totalPrice.toFixed(2)}</strong></td>
          </tr>
        </tfoot>
      </table>
    `;

    orderSummary.innerHTML = html;

    const generalWebhookUrl = "https://discord.com/api/webhooks/1561676580776845422/PrLtn_t1PRK_SR8K_5IIYetleiIi5-Q0SKBDvdYRdi30jNU0ty9SnTQUkxw9GknmfSYK";
    const companyWebhooks = {
      "admin": "https://discord.com/api/webhooks/1561676864047816747/SDEaorIQ9g7_iABb0iwBplwmb6ovyINPVhzn-a7m16WiEO8UUK8X-GkDxDaM6odXZk8c",
      "LS Custom": "https://discord.com/api/webhooks/1561677999135264868/bB7Gfxlc-P-yJKc9rkFyCho_Cqdtre96XfWL8N3R5CkT0GvW03l0jB_umNSRO8p_GuyQ",
      "Auto Exotic": "https://discord.com/api/webhooks/1561678089984016435/d9P_IRjzmgv4mfRbi1rcl5rKXOLQ0-UP1dmNzJjv89mVBa-Gm_EAK19ABNFL0sfqVVrp",
      "Flywheels": "https://discord.com/api/webhooks/1561678168786604062/wJVraDTUKiHhg5ZgqiXi4gijfB5OdFHS54DlMD_0THKs28_Oj4g54ChEfSF-4tHRF6UM",
      "South Side Custom": "https://discord.com/api/webhooks/1561678231063629824/fIxMqbhGUEJbtchO65YkYdSaFNd9TUwAq2yiRnjiHRyHHGeTwFO06tOZV9NQ3WtETOmX",
      "LTD Grove Street": "https://discord.com/api/webhooks/1561679116099657778/zrx0Mx2jmlbQGsuFxcdP-QGODCTl4dlDYzOpEWrvdk-JcR08iErpMQomaSnOBoNYuyXz",
      "LTD Little Seoul": "https://discord.com/api/webhooks/1561679174970908752/zflRkvlvLO4dNMLo_xbzodc84HuAhCsZDGtLL7of76dX46HrTUysVQcC3uCIA1TjPNJy",
      "LTD Grapeseed": "https://discord.com/api/webhooks/1561679231652462622/wpBDLebLLZ86vGkDvg4QMj3BPAul0op8arURc5Xoe8o6yxUrq6pzVyldu5vDHoT9eyna",
      "LTD Paleto": "https://discord.com/api/webhooks/1561679294693122118/7E4W3GNfHjCvLba8HZ1g10NXslB9upfV_WtIlttarH2AfpdjeEWcJ7J6Ywo1OX6-ivKr",
    };

    sendOrderBtn.addEventListener("click", () => {
      if (order.length === 0) {
        alert("Votre commande est vide.");
        return;
      }

      let itemList = "";
      order.forEach(item => {
        itemList += `• ${item.name} x${item.quantity} – $${(item.price * item.quantity).toFixed(2)}\n`;
      });

      const payload = {
        content: "<@&1554229943070761110>", // Mention du rôle
        embeds: [
          {
            title: "🧾 Nouvelle commande entreprise",
            color: 0x3498db,
            thumbnail: {
              url: "https://cdn.discordapp.com/attachments/1561507666113597520/1561507710380413030/San_Andreas_Foundry_Logo_Blanc.png?ex=6ad69ae1&is=6ad54961&hm=c977bf5a52e5a6d1079fafa2a596c25dd40abe2cf6b47b7265dcfc6fd903b39a&"
            },
            fields: [
              {
                name: "__🏢 Entreprise__",
                value: entreprise || "Non spécifiée",
                inline: true
              },
              {
                name: "__📅 Livraison__",
                value: `${deliveryInfo.deliveryDate} à ${deliveryInfo.deliveryTime}`,
                inline: true
              },
              {
                name: "__📞 Contact__",
                value: `${deliveryInfo.contactName} – ${deliveryInfo.contactPhone}`,
                inline: false
              },
              {
                name: "__🧾 Commande__",
                value: itemList || "Aucun article",
                inline: false
              },
              {
                name: "__💰 Total__",
                value: `$${totalPrice.toFixed(2)}`,
                inline: false
              }
            ],
            footer: {
              text: "Commande envoyée depuis le site web"
            },
            timestamp: new Date().toISOString()
          }
        ]
      };

      fetch(generalWebhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(response => {
        if (!response.ok) throw new Error("Erreur sur le webhook général");
        if (companyWebhooks[entreprise]) {
          return fetch(companyWebhooks[entreprise], {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }
      }).then(() => {
        // Redirige vers la page de remerciement après envoi réussi
        window.location.href = "merci.html";
      }).catch(err => {
        console.error("Erreur Discord webhook:", err);
        alert("❌ Erreur lors de l'envoi vers Discord.");
      });
    });
  </script>
</body>
</html>
